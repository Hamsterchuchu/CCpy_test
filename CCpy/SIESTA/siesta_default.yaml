# siesta_default.yaml
# -----------------------------------------------------------------------------
# 이 파일을 작업 디렉토리에 "siesta_default.yaml" 이름으로 두면
# CCpySIESTAInputGen.py가 실행할 때 자동으로 읽어서 아래 값들을 CLI 옵션의
# 기본값으로 사용합니다.
# (다른 이름/경로를 쓰고 싶으면 --config 옵션으로 지정: --config lab_defaults.yaml)
#
# 실제 커맨드라인에서 옵션을 직접 주면 그 값이 이 파일의 값보다 항상 우선합니다.
# 즉, 평소엔 옵션 없이 실행하고 특정 계산만 다르게 하고 싶을 때만 CLI로 덮어쓰면 됩니다.
#
# key 이름은 --long-option 에서 하이픈(-)을 언더스코어(_)로 바꾼 것과 같습니다.
# 예) --kgrid-from-car -> kgrid_from_car,  --pseudo-dir -> pseudo_dir
#
# 주의: mode(opt/nvt/nve/npe/npt/anneal/scf)는 이 파일로 지정할 수 없습니다.
# 반드시 실행할 때 맨 앞에 숫자로 직접 넣어야 합니다 (예: 아래처럼 "1").
# 숫자를 안 주면 CCpySIESTAInputGen.py는 바로 사용법만 보여주고 끝납니다.
#
# 아래는 연구실에서 자주 쓰는 조합 예시입니다:
#   기존: python CCpySIESTAInputGen.py 1 --kgrid-from-car --pseudo-dir ../POT/Dojo \
#                               -maxforce=0.02 --no-sort -basis=sz  ZnOHX3L.car
#   이 설정 파일을 두면: python CCpySIESTAInputGen.py 1 ZnOHX3L.car   (끝, .cif/POSCAR/CONTCAR도 동일)
# -----------------------------------------------------------------------------

basis: SZ                    # SZ / SZP / DZ / DZP / TZ / TZP
kgrid_from_car: true         # .car/.cif/POSCAR의 셀 정보로부터 kgrid 자동 계산
max_force: 0.02              # MD.MaxForceTol (eV/Ang). 0.02(default), 0.05(rough), 0.01(tight)
no_sort: true                # 원자 순서를 입력 파일 그대로 유지 (정렬 안 함)

# pot는 이제 안 줘도 됩니다. 기본값은 dojo이며 스크립트에 내장된 경로
# (/opt/siesta/POT/Dojo)에서 원소별로 자동으로 찾습니다.
# PSF/PSF_old를 쓰고 싶을 때만 아래처럼 명시적으로 지정하세요:
# pot: psf                   # dojo(default) / psf / psfold
# pseudo_dir: /opt/siesta/POT/PSF_old   # (지정하면 -pot보다 항상 우선)

# CCpySIESTAInputGen.py의 "Anything want to modify or add?" 프롬프트와 같은 역할을
# 하는 비대화형 옵션입니다. 콤마로 구분된 KEY=VALUE 목록이며, 기존 fdf 옵션과
# 겹치면 그 줄을 덮어쓰고, fdf 템플릿에 없는 옵션(예: SCF.H.Tolerance)이면
# 새 줄로 추가합니다. ElectronicTemperature/MeshCutoff/MD.MaxForceTol은 숫자만
# 써도 단위(K / Ry / eV/Ang)가 자동으로 붙습니다.
# extra: "XC.functional=LDA,MaxSCFIterations=50"

# 아래는 자주 바꾸지 않는 값들의 예시입니다. 필요할 때만 주석을 풀어 사용하세요.
# vacuum: 20.0
# kgrid_target: 20.0
# meshcutoff: 300.0
# etemp: 300.0
# partition: 72core
# ntasks: 24
# nodes: 1
# time: "7-00:00:00"
